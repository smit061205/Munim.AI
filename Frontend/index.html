<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F5F7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Munim" />
    <meta
      name="description"
      content="Munim.AI brings your investments, spending and goals into one honest picture, with an assistant that knows your numbers."
    />
    <title>Munim.AI: your money, in one honest picture</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Munim.AI" />
    <meta property="og:title" content="Munim.AI: your money, in one honest picture" />
    <meta property="og:description" content="Investments, spending, tax and goals, with an assistant that knows your numbers. Made for India." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Replaced as soon as the app starts; seen only if the app's script fails to load -->
      <div id="boot-fallback" hidden style="font-family: system-ui, sans-serif; max-width: 22rem; margin: 30vh auto 0; padding: 0 16px; color: #1f2937; text-align: center">
        <p style="font-size: 1.125rem; font-weight: 600; margin: 0 0 8px">Munim didn't load</p>
        <p style="margin: 0 0 16px; color: #4b5563">The connection dropped while the app was loading. Check your internet and try again.</p>
        <button onclick="location.reload()" style="height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: #2b3fb4; color: #fff; font-size: 0.95rem; cursor: pointer">Reload</button>
      </div>
      <script>
        // Show the message only if the app hasn't started after 8 seconds
        setTimeout(function () {
          var el = document.getElementById("boot-fallback");
          if (el) el.hidden = false;
        }, 8000);
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
